[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-statistician"
version = "0.1.0"
description = "Universal statistical assistant: any official statistic, any period, normalized and attributed to its source."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sdmx1>=2.27.0",
    "pandas>=2.0",
    "mcp>=2.0.0",
    "typer>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pxwebpy>=0.6.0",
    "anthropic>=0.121.0",
    "requests>=2.31",
    "pycountry>=24.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
universal-statistician-mcp = "universal_statistician.mcp_server:main"
ustat = "universal_statistician.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires internet access to a live official-statistics API (skipped by default)",
]
